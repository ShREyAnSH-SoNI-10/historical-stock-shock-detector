[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "historical-stock-shock-detector"
version = "1.0.0"
description = "Historical-pattern APP downside-risk research prototype"
requires-python = ">=3.10"
dependencies = ["numpy>=2.0,<3", "pandas>=2.2,<4"]

[tool.setuptools.packages.find]
include = ["shock_model*"]
